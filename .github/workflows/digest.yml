name: Daily competitor digest

# Бесплатно: GitHub Actions на публичном репозитории не тарифицируется,
# состояние (seen.json) коммитится обратно в репозиторий — база не нужна.

on:
  schedule:
    - cron: "0 6 * * *"      # 09:00 МСК каждый день
  workflow_dispatch:
    inputs:
      preset:
        description: "Набор источников"
        default: "ai"
        type: choice
        options: [ai, fashion]

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          # Всё опционально. Пусто -> extractive-движок, дайджест в лог.
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m ai_researcher \
            --preset "${{ inputs.preset || 'ai' }}" \
            --save-markdown \
            --verbose

      - name: Commit state and archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data digests || true
          git diff --staged --quiet || git commit -m "chore: digest $(date -u +%F)"
          git push
