[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-researcher"
version = "1.0.0"
description = "Ежедневный дайджест новостей конкурентов в Telegram. Без платных API-ключей."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maria Novikova" }]
keywords = ["rss", "competitive-intelligence", "telegram-bot", "nlp", "summarization"]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
ai-researcher = "ai_researcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
